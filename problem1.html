<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flood Probability Plotter — Problem 1</title>
<style>
	:root{--ink:#222;--grid:#9a9a9a;--btn:#efefef;--btnb:#666;}
	body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:white;}
	.page{max-width:1100px;margin:18px auto 26px auto;padding:0 14px;}
	h1{margin:4px 0 10px 0;font-size:38px;font-weight:700;}
	.plotWrap{display:flex;justify-content:center;}
	canvas{background:white;border:0;width:min(980px,96vw);height:auto;touch-action:none;}
	.controls{margin:8px 0 10px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
	.controls .spacer{flex:1 1 auto;}
	.btn{font-family:Arial,Helvetica,sans-serif;font-size:18px;padding:6px 18px;background:var(--btn);border:2px solid var(--btnb);cursor:pointer;box-shadow:1px 1px 0 rgba(0,0,0,.12);}
	.btn:active{transform:translateY(1px);box-shadow:none;}
	.msg{margin-left:8px;font-size:16px;color:#b00020;min-height:20px;}
	table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:16px;}
	th,td{border:2px solid #333;padding:0;}
	th{background:#f0f0f0;text-align:left;padding:8px 10px;font-size:18px;}
	td input{width:100%;box-sizing:border-box;border:none;padding:8px 10px;font-size:16px;font-family:Arial,Helvetica,sans-serif;background:white;}
	td input:focus{outline:2px solid #4a90e2;outline-offset:-2px;}
	.smallNote{font-size:14px;color:#444;margin-top:8px;}
	.footer{margin-top:12px;font-size:14px;color:#333;text-align:left;}
	@media print{
		.page{max-width:none;margin:0;padding:0;}
		.controls,.msg{display:none!important;}
		.smallNote{display:none!important;}
		h1{margin:0 0 8px 0;}
		canvas{width:100%!important;height:auto!important;}
		table{font-size:12px;}
		th{font-size:12px;}
		td input{font-size:12px;}
	}
</style>
</head>
<body>
<div class="page">
	<h1>Flood Probability Plotter — Problem 1</h1>
	<div class="plotWrap">
		<canvas id="plot" width="980" height="970" aria-label="Probability plot"></canvas>
	</div>
	<div class="controls">
		<div class="spacer"></div>
		<button class="btn" id="plotBtn" type="button">Plot</button>
		<button class="btn" id="clearBtn" type="button">Clear Plot</button>
		<button class="btn" id="resetBtn" type="button">Reset Table</button>
		<button class="btn" id="printBtn" type="button">Print/PDF</button>
	</div>
	<div class="msg" id="msg"></div>
	<table id="dataTable">
		<thead>
			<tr>
				<th style="width:13%;">Year</th>
				<th style="width:16%;">Stage (feet)</th>
				<th style="width:16%;">WSE</th>
				<th style="width:12%;">Rank</th>
				<th style="width:17%;">Probability (%)</th>
				<th style="width:18%;">RI (years)</th>
			</tr>
		</thead>
		<tbody id="tbody"></tbody>
	</table>
	<div class="smallNote">Complete the table, then click Plot. Drag the green circles to adjust the blue trend line. Drag from the top or right plot border to create movable guide lines.</div>
	<div class="footer">Made by Dr. G.S. Springer and ChatGPT</div>
</div>
<script>
(() => {
	"use strict";
	const INITIAL_ROWS=[
		["2017","19","1219","6","60","1.67"],
		["2018","22","","","",""],
		["2019","23.1","","","",""],
		["2020","15.1","","","",""],
		["2021","20","","","",""],
		["2022","18.1","","","",""],
		["2023","24.7","","","",""],
		["2024","16.8","","","",""],
		["2025","21","","","",""]
	];
	const PROB_TICKS=[99.5,99,95,90,75,50,25,10,5,1,0.5,0.1];
	const MINOR_PROB_TICKS=[4,3,2];
	const TOP_MINOR_PROB_TICKS=[0.2];
	const Y_MAX=40;
	const canvas=document.getElementById("plot");
	const ctx=canvas.getContext("2d");
	const tbody=document.getElementById("tbody");
	const msg=document.getElementById("msg");
	const G={left:120,right:40,top:150,bottom:120};
	let dataPoints=[];
	let anchors={a:{x:0,y:0},b:{x:0,y:0}};
	let dragging=null;
	let guideH={active:false,y:0,dragging:false,pointerId:null};
	let guideV={active:false,x:0,dragging:false,pointerId:null};
	function setMessage(s){msg.textContent=s||"";}
	function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
	function bounds(){return {L:G.left,R:canvas.width-G.right,T:G.top,B:canvas.height-G.bottom};}
	function normInv(p){
		if(!(p>0&&p<1))return NaN;
		const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239];
		const b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572];
		const c=[-.007784894002430293,-.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
		const d=[.007784695709041462,.3224671290700398,2.445134137142996,3.754408661907416];
		const pl=.02425,ph=1-pl;let q,r;
		if(p<pl){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
		if(p>ph){q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
		q=p-.5;r=q*q;
		return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
	}
	function probToZ(pct){return normInv(1-pct/100);}
	function probCanvas(p){const {L,R}=bounds(),z=probToZ(p),z0=probToZ(PROB_TICKS[0]),z1=probToZ(PROB_TICKS[PROB_TICKS.length-1]);return L+(z-z0)/(z1-z0)*(R-L);}
	function yToCanvas(v){const {T,B}=bounds();return B-(v/Y_MAX)*(B-T);}
	function defaultAnchors(){const {L,R,T,B}=bounds();anchors.a={x:L,y:B};anchors.b={x:R,y:T};}
	function nearestBorderPoint(x,y){
		const {L,R,T,B}=bounds(),cx=clamp(x,L,R),cy=clamp(y,T,B);
		const ds=[{d:Math.abs(cx-L),p:{x:L,y:cy}},{d:Math.abs(R-cx),p:{x:R,y:cy}},{d:Math.abs(cy-T),p:{x:cx,y:T}},{d:Math.abs(B-cy),p:{x:cx,y:B}}];
		ds.sort((a,b)=>a.d-b.d);return ds[0].p;
	}
	function anchorHit(x,y){for(const k of ["a","b"]){const dx=x-anchors[k].x,dy=y-anchors[k].y;if(dx*dx+dy*dy<=144)return k;}return null;}
	function formatRI(ri){return ri<10?ri.toFixed(2).replace(/0+$/,"").replace(/\.$/,""):String(Math.round(ri));}
	function formatPct(p){return Math.abs(p-Math.round(p))<1e-9?String(Math.round(p)):String(p);}
	function labelBg(text,x,y,align,baseline){
		ctx.save();ctx.font="20px Arial";ctx.textAlign=align;ctx.textBaseline=baseline;
		const w=ctx.measureText(text).width,h=20,pad=4;
		let left=align==="center"?x-w/2:align==="right"?x-w:x;
		let top=baseline==="top"?y:baseline==="middle"?y-h/2:y-h;
		ctx.fillStyle="white";ctx.fillRect(left-pad,top-2,w+2*pad,h+4);
		ctx.fillStyle="#222";ctx.fillText(text,x,y);ctx.restore();
	}
	function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);drawTitles();drawAxes();drawPoints();drawTrend();drawGuides();}
	function drawTitles(){
		ctx.save();ctx.fillStyle="#222";ctx.textAlign="center";
		ctx.font="42px Arial";ctx.fillText("Recurrence Interval (years)",canvas.width/2,54);
		ctx.font="40px Arial";ctx.fillText("Probability (%)",canvas.width/2,canvas.height-40);
		ctx.translate(42,canvas.height/2);ctx.rotate(-Math.PI/2);ctx.font="38px Arial";ctx.fillText("stage (feet)",0,0);ctx.restore();
	}
	function drawAxes(){
		const {L,R,T,B}=bounds();ctx.save();
		ctx.strokeStyle="#2a2a2a";ctx.lineWidth=4;ctx.strokeRect(L,T,R-L,B-T);
		ctx.font="20px Arial";ctx.textAlign="center";ctx.textBaseline="top";
		for(const p of PROB_TICKS){
			const x=probCanvas(p);ctx.strokeStyle="#7f7f7f";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,B);ctx.stroke();
			ctx.strokeStyle="#2a2a2a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,B);ctx.lineTo(x,B+12);ctx.stroke();ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T-12);ctx.stroke();
			labelBg(formatPct(p),x,B+16,"center","top");labelBg(formatRI(100/p),x,T-26,"center","bottom");
		}
		ctx.strokeStyle="#2a2a2a";ctx.lineWidth=2;
		for(const p of MINOR_PROB_TICKS){const x=probCanvas(p);ctx.beginPath();ctx.moveTo(x,B);ctx.lineTo(x,B+8);ctx.stroke();ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T-8);ctx.stroke();}
		for(const p of TOP_MINOR_PROB_TICKS){const x=probCanvas(p);ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T-8);ctx.stroke();}
		ctx.textAlign="right";ctx.textBaseline="middle";
		for(let v=0;v<=Y_MAX;v+=5){
			const y=yToCanvas(v);
			if(v<Y_MAX){ctx.strokeStyle="#7f7f7f";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke();}
			ctx.strokeStyle="#2a2a2a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L-12,y);ctx.lineTo(L,y);ctx.stroke();ctx.beginPath();ctx.moveTo(R,y);ctx.lineTo(R+12,y);ctx.stroke();
			ctx.fillStyle="#222";ctx.font="24px Arial";ctx.fillText(String(v),L-18,y);
		}
		ctx.strokeStyle="#2a2a2a";ctx.lineWidth=2;
		for(let v=1;v<Y_MAX;v+=1){if(v%5===0)continue;const y=yToCanvas(v);ctx.beginPath();ctx.moveTo(L-7,y);ctx.lineTo(L,y);ctx.stroke();ctx.beginPath();ctx.moveTo(R,y);ctx.lineTo(R+7,y);ctx.stroke();}
		ctx.restore();
	}
	function drawPoints(){
		if(!dataPoints.length)return;const r=clamp(7-2.2*Math.log10(Math.max(dataPoints.length,1)),1.2,6);ctx.save();ctx.lineWidth=2;
		for(const pt of dataPoints){const x=probCanvas(pt.p),y=yToCanvas(pt.y);ctx.beginPath();ctx.arc(x,y,r,0,2*Math.PI);ctx.fillStyle="#12a4d9";ctx.fill();ctx.strokeStyle="#1b1b1b";ctx.stroke();}ctx.restore();
	}
	function drawTrend(){
		ctx.save();ctx.strokeStyle="#2e4fa2";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(anchors.a.x,anchors.a.y);ctx.lineTo(anchors.b.x,anchors.b.y);ctx.stroke();
		for(const k of ["a","b"]){ctx.beginPath();ctx.arc(anchors[k].x,anchors[k].y,8,0,2*Math.PI);ctx.fillStyle="#21b14c";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#1b1b1b";ctx.stroke();}
		ctx.restore();
	}
	function drawGuides(){
		const {L,R,T,B}=bounds();ctx.save();ctx.strokeStyle="#111";ctx.lineWidth=1;
		if(guideH.active){const y=clamp(guideH.y,T,B);ctx.beginPath();ctx.moveTo(L-8,y);ctx.lineTo(R+8,y);ctx.stroke();}
		if(guideV.active){const x=clamp(guideV.x,L,R);ctx.beginPath();ctx.moveTo(x,T-8);ctx.lineTo(x,B+8);ctx.stroke();}
		ctx.restore();
	}
	function renderRows(rows){
		tbody.innerHTML="";
		const cols=["year","stage","wse","rank","prob","ri"];
		rows.forEach(row=>{const tr=document.createElement("tr");row.forEach((val,i)=>{const td=document.createElement("td"),inp=document.createElement("input");inp.type="text";inp.inputMode="decimal";inp.autocomplete="off";inp.spellcheck=false;inp.dataset.col=cols[i];inp.value=val;td.appendChild(inp);tr.appendChild(td);});tbody.appendChild(tr);});
	}
	function parseData(){
		const pts=[];let has=false;
		for(const r of tbody.querySelectorAll("tr")){
			const s=r.querySelector('input[data-col="stage"]').value.trim();
			const p=r.querySelector('input[data-col="prob"]').value.trim();
			if(s===""||p==="")continue;
			const stage=Number(s),prob=Number(p);
			if(!Number.isFinite(stage)||!Number.isFinite(prob))return {ok:false,err:"Stage and Probability must be numeric."};
			if(stage<0||stage>Y_MAX)return {ok:false,err:"Stage values must be between 0 and 40 feet."};
			if(prob<=0||prob>=100)return {ok:false,err:"Probability values must be between 0 and 100 percent."};
			has=true;pts.push({p:prob,y:stage});
		}
		if(!has)return {ok:false,err:"Enter Probability values for the rows you want to plot, then click Plot."};
		return {ok:true,pts};
	}
	function pointerPos(evt){const rect=canvas.getBoundingClientRect();return {x:(evt.clientX-rect.left)*(canvas.width/rect.width),y:(evt.clientY-rect.top)*(canvas.height/rect.height)};}
	canvas.addEventListener("pointerdown",evt=>{
		const {x,y}=pointerPos(evt),hit=anchorHit(x,y),{L,R,T,B}=bounds();
		if(hit){dragging=hit;try{canvas.setPointerCapture(evt.pointerId);}catch(e){};return;}
		if(x>=L&&x<=R&&y>=T-18&&y<=T+12){guideH={active:true,y:clamp(y,T,B),dragging:true,pointerId:evt.pointerId};try{canvas.setPointerCapture(evt.pointerId);}catch(e){};draw();return;}
		if(y>=T&&y<=B&&x>=R-12&&x<=R+18){guideV={active:true,x:clamp(x,L,R),dragging:true,pointerId:evt.pointerId};try{canvas.setPointerCapture(evt.pointerId);}catch(e){};draw();return;}
	});
	canvas.addEventListener("pointermove",evt=>{
		const {x,y}=pointerPos(evt),{L,R,T,B}=bounds();
		if(dragging){anchors[dragging]=nearestBorderPoint(x,y);draw();return;}
		if(guideH.dragging&&evt.pointerId===guideH.pointerId){guideH.y=clamp(y,T,B);draw();return;}
		if(guideV.dragging&&evt.pointerId===guideV.pointerId){guideV.x=clamp(x,L,R);draw();return;}
	});
	function endPointer(evt){dragging=null;if(guideH.pointerId===evt.pointerId){guideH.dragging=false;guideH.pointerId=null;}if(guideV.pointerId===evt.pointerId){guideV.dragging=false;guideV.pointerId=null;}try{canvas.releasePointerCapture(evt.pointerId);}catch(e){};}
	canvas.addEventListener("pointerup",endPointer);canvas.addEventListener("pointercancel",endPointer);
	document.getElementById("plotBtn").addEventListener("click",()=>{setMessage("");const parsed=parseData();if(!parsed.ok){setMessage(parsed.err);return;}dataPoints=parsed.pts;defaultAnchors();draw();});
	document.getElementById("clearBtn").addEventListener("click",()=>{setMessage("");dataPoints=[];guideH={active:false,y:0,dragging:false,pointerId:null};guideV={active:false,x:0,dragging:false,pointerId:null};defaultAnchors();draw();});
	document.getElementById("resetBtn").addEventListener("click",()=>{setMessage("");dataPoints=[];renderRows(INITIAL_ROWS);guideH={active:false,y:0,dragging:false,pointerId:null};guideV={active:false,x:0,dragging:false,pointerId:null};defaultAnchors();draw();});
	document.getElementById("printBtn").addEventListener("click",()=>{draw();window.print();});
	renderRows(INITIAL_ROWS);defaultAnchors();draw();
})();
</script>
</body>
</html>
